[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/window",
    "crates/canvas",
    "crates/icon_library",
    "crates/gpa_core",
    "crates/mcp_server",
    "crates/sys_utils",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Mii <miifrommera@gmail.com>"]
description = "GTK 4.24 & Libadwaita 1.10 GPA Symbolic Icon Animator with MCP Server"
license = "MIT"

[workspace.lints.rust]
rust_2018_idioms = "deny"
unused_must_use = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = "warn"
type_complexity = "warn"
nursery = "warn"

[workspace.dependencies]
gpa-window = { path = "crates/window" }
gpa-canvas = { path = "crates/canvas" }
gpa-icon-library = { path = "crates/icon_library" }
gpa-core = { path = "crates/gpa_core" }
gpa-mcp-server = { path = "crates/mcp_server" }
gpa-sys-utils = { path = "crates/sys_utils" }

anyhow = "1.0.104"
arc-swap = "1.9.3"
async-channel = "2.5.0"
async-trait = "0.1"
bitflags = "2.13.2"
bytes = "1.12.1"
cairo-rs = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0.0"
env_logger = "0.11.11"
frizbee = "0.13.0"
futures-channel = "0.3.34"
futures-util = "0.3.34"
gdk-pixbuf = "0.22"
gio = { version = "0.22", features = ["v2_76"] }
glib = "0.22"
glib-build-tools = "0.22"
gsk4 = { version = "0.11", features = ["v4_24"] }
gtk4 = { version = "0.11", features = ["v4_24"] }
home = "0.5.12"
http = "1.5.0"
http-body-util = "0.1.5"
ignore = "0.4.34"
libadwaita = { version = "0.9", features = ["v1_10", "gtk_v4_24"] }
log = { version = "0.4.34", features = ["std", "serde", "release_max_level_info"] }
notify = "8.2.1"
notify-debouncer-mini = "0.7.0"
pango = "0.22"
parking_lot = "0.13.0"
rand = "0.10.3"
regex = "1.13.1"
resvg = "0.49.0"
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server", "macros", "schemars"] }
schemars = "1.2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
similar = { version = "3.2.1", features = ["inline", "unicode"] }
sourceview5 = "0.11"
tempfile = "3.27.0"
thiserror = "2.0"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
